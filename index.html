<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Анастасия Андреева</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .profile {
            background: #fff;
            max-width: 720px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }

        .profile h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .profile .subtitle {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 24px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 16px;
        }

        .profile h2 {
            font-size: 20px;
            color: #34495e;
            margin: 24px 0 12px;
            text-align: left;
        }

        .profile p {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 12px;
            text-align: left;
        }

        .skills {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            justify-content: flex-start;
        }

        .skills li {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .contact {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #ecf0f1;
            font-size: 15px;
            color: #555;
            text-align: left;
        }

        .contact a {
            color: #667eea;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* Кнопка «Подписаться на новости» */
        .subscribe-btn {
            display: block;
            margin: 32px auto 0;
            padding: 14px 32px;
            background: #ff294d;
            color: #ffc0cb;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.15s;
        }

        .subscribe-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .subscribe-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="profile">
        <h1>Анастасия Абдалова</h1>
        <p class="subtitle">Студентка • Начинающий веб-разработчик</p>

        <h2>Обо мне</h2>
        <p>
            Учусь в тк 34.
        </p>
       
        <h2>Навыки</h2>
        <ul class="skills">
            <li>HTML5</li>
            <li>CSS3</li>
            <li>Git</li>
            <li>GitHub</li>
            <li>Основы JavaScript</li>
            <li>Работа в команде</li>
        </ul>

        <h2>Контакты</h2>
        <div class="contact">
            Email: <a href="mailto:anastasijaandreevnaa@rambler.ru">anastasijaandreevnaa@rambler.ru</a><br>
            GitHub: <a href="https://github.com/shine11123">github.com/shine11123</a>
        </div>

        <!-- Кнопка «Подписаться на новости» -->
        <button class="subscribe-btn" type="button">Подписаться на новости</button>
    </div>
<div style="
    max-width: 320px;
    margin: 24px auto 0;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
">
    <h3 style="margin-bottom: 12px;">Вход через соцсети</h3>
    <button style="display:block;width:100%;margin:6px 0;padding:10px;
        background:#3b5998;color:#fff;border:none;border-radius:6px;cursor:pointer;">
        Facebook
    </button>
    <button style="display:block;width:100%;margin:6px 0;padding:10px;
        background:#1da1f2;color:#fff;border:none;border-radius:6px;cursor:pointer;">
        Twitter
    </button>
    <button style="display:block;width:100%;margin:6px 0;padding:10px;
        background:#db4437;color:#fff;border:none;border-radius:6px;cursor:pointer;">
        Google
    </button>
</div>

</body>
</html>
